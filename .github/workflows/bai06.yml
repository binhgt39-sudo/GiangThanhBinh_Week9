name: Bai06 Maven Cache

on:
  push:
    paths: [Bai06/**, .github/workflows/bai06.yml]
  pull_request:
    paths: [Bai06/**, .github/workflows/bai06.yml]

permissions:
  contents: read

jobs:
  bai06-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: setup-java
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Show Maven cache result
        run: 'echo "Maven cache hit: ${{ steps.setup-java.outputs.cache-hit }}"'
      - name: Test and check coverage
        run: mvn --batch-mode verify
        working-directory: Bai06
      - uses: actions/upload-artifact@v6
        with:
          name: bai06-jacoco-report
          path: Bai06/target/site/jacoco/index.html
          if-no-files-found: error
