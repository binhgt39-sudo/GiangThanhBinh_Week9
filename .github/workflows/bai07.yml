name: Bai07 Pull Request Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'Bai07/**'
      - '.github/workflows/bai07.yml'

permissions: {}

jobs:
  bai07-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test and check coverage
        run: mvn --batch-mode verify
        working-directory: Bai07

  bai07-checkstyle-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate Checkstyle report
        run: mvn --batch-mode checkstyle:checkstyle
        working-directory: Bai07
      - name: Add inline review comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const xml = fs.readFileSync('Bai07/target/checkstyle-result.xml', 'utf8');
            const files = [...xml.matchAll(/<file name="([^"]+)">([\s\S]*?)<\/file>/g)];
            const errors = [];

            for (const [, filename, body] of files) {
              const normalized = filename.replaceAll('\\\\', '/');
              const marker = normalized.lastIndexOf('/Bai07/');
              const repoPath = marker >= 0
                ? normalized.slice(marker + 1)
                : path.relative(process.env.GITHUB_WORKSPACE, normalized).replaceAll('\\\\', '/');
              for (const [, attrs] of body.matchAll(/<error\s+([^>]+)\/>/g)) {
                const get = (name) => attrs.match(new RegExp(name + '="([^"]*)"'))?.[1] || '';
                errors.push({
                  path: repoPath,
                  line: Number(get('line')),
                  message: get('message').replaceAll('&quot;', '"').replaceAll('&apos;', "'").replaceAll('&lt;', '<').replaceAll('&gt;', '>').replaceAll('&amp;', '&'),
                  source: get('source').split('.').pop()
                });
              }
            }

            for (const error of errors) {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: context.payload.pull_request.head.sha,
                path: error.path,
                line: error.line,
                side: 'RIGHT',
                body: 'Checkstyle ' + error.source + ': ' + error.message
              });
            }

            if (errors.length) core.setFailed('Checkstyle reported ' + errors.length + ' violation(s).');
            else core.info('No Checkstyle violations found.');
