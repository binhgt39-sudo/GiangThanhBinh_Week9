name: Bai07 Pull Request Review

on:
  pull_request:
    branches: [main]
    paths: [Bai07/**]

permissions: {}

jobs:
  bai07-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test and check coverage
        run: mvn --batch-mode verify
        working-directory: Bai07

  bai07-checkstyle-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: error
          workdir: Bai07
