name: Bai10 Shipping Pipeline

on:
  push:
    paths: [Bai10/**]
  pull_request:
    paths: [Bai10/**]

permissions:
  contents: read

jobs:
  bai10-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Test and package
        run: mvn --batch-mode verify
        working-directory: Bai10
